name = "MultisolverProofs"
defaultTargets = ["Multisolver", "Controls"]

[leanOptions]
autoImplicit = false
# a proof left as `sorry` warns, so this fails the build on one
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "Multisolver"

# The axioms of every declaration of Multisolver, and the controls: examples where each theorem's conclusion fails
# without one of its hypotheses, and where its constant is attained.
[[lean_lib]]
name = "Controls"
