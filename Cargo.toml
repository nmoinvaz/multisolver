[package]
name = "multisolver"
version = "0.2.2"
edition = "2021"
rust-version = "1.89"
description = "Nonlinear solvers in double-, quad- and octo-double precision: damped Newton, chord and Shamanskii, GMRES-refined Newton, Levenberg-Marquardt, the asymptotic numerical method, continuation predictors, weak singular subspaces, series singularities and the argument-principle zero count"
license = "BSD-3-Clause"
repository = "https://github.com/nmoinvaz/multisolver"
readme = "README.md"
keywords = ["newton", "nonlinear-solver", "extended-precision", "continuation", "argument-principle"]
categories = ["mathematics", "science"]
exclude = ["/.github", "/.claude", "/CLAUDE.md", "/docs", "/scripts"]

[dependencies]
# 4.5.0: the Precision trait (Double, Quad, Octo) and its LUs; the blocked complex LU
multidouble = "5.1.0"
rayon = "1.10"

[features]
# the plain-array SIMD backend of multidouble on every target
portable = ["multidouble/portable"]

[[example]]
name = "graphs"
# its controls of the planted-truth checks run with the tests
test = true

[profile.release]
opt-level = 3
